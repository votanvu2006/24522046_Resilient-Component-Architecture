<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Component Architecture</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="component" aria-label="Loaded data">
            <header class="component-header">
                <div>
                    <h1>Resilient Component</h1>
                    <p>Live data loaded successfully.</p>
                </div>

                <div class="metadata">
                    <span class="badge">Live</span>
                    <span class="badge">3 Items</span>
                    <span class="badge">Updated Now</span>
                </div>
            </header>

            <div class="data-grid">
                <article class="data-card">
                    <h2>Component Alpha</h2>
                    <p>Primary application component.</p>
                    <span class="status">Active</span>
                </article>

                <article class="data-card">
                    <h2>Component Beta</h2>
                    <p>Secondary application component.</p>
                    <span class="status">Active</span>
                </article>

                <article class="data-card">
                    <h2>Component Gamma</h2>
                    <p>Supporting application component.</p>
                    <span class="status">Active</span>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
