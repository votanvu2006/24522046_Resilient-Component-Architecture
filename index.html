<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Component Architecture</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="component" aria-labelledby="component-title">
            <header class="component-header">
                <div>
                    <h1 id="component-title">Resilient Component</h1>
                    <p>Data loaded successfully.</p>
                </div>

                <div class="metadata">
                    <span class="badge">Live</span>
                    <span class="badge">0 Items</span>
                </div>
            </header>

            <div class="empty-state" role="status">
                <div class="empty-icon" aria-hidden="true">○</div>
                <h2>No data available</h2>
                <p>
                    The request completed successfully, but there are
                    currently no items to display.
                </p>
            </div>
        </section>
    </main>
</body>
</html>
