<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resilient Component Architecture</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <section class="component" aria-labelledby="component-title">
            <header class="component-header">
                <div>
                    <h1 id="component-title">Resilient Component</h1>
                    <p id="component-description">Unable to load component data.</p>
                </div>

                <div class="metadata">
                    <span class="badge error-badge">Error</span>
                </div>
            </header>

            <div
                id="error-state"
                class="error-state"
                role="alert"
                aria-live="assertive"
            >
                <div class="error-icon" aria-hidden="true">!</div>

                <h2>Something went wrong</h2>

                <p>
                    We couldn't load the data. Please try again.
                </p>

                <button id="retry-button" class="retry-button" type="button">
                    Retry
                </button>
            </div>

            <div
                id="loading-state"
                class="loading-state"
                aria-live="polite"
                aria-busy="true"
                hidden
            >
                <p class="sr-only">Loading data, please wait.</p>

                <div class="skeleton-grid">
                    <article class="skeleton-card">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text short"></div>
                    </article>

                    <article class="skeleton-card">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text short"></div>
                    </article>

                    <article class="skeleton-card">
                        <div class="skeleton skeleton-title"></div>
                        <div class="skeleton skeleton-text"></div>
                        <div class="skeleton skeleton-text short"></div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
